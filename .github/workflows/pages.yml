name: Publicar o Mentor Bauer pessoal no Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Uma publicação por vez; não interromper um deploy já iniciado.
concurrency:
  group: mentor-bauer-pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, SHA oficial
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, SHA oficial
        with:
          node-version: 26.6.0
          cache: npm
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Dependências do lock, sem scripts de instalação
        run: npm ci --ignore-scripts
      - name: Chromium efêmero do runner para provas da PWA
        run: npx playwright install --with-deps chromium
      - name: Tipos, domínio, integridade, build, HTTP e navegador offline
        run: npm run validate:pages
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/client
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publicar apenas o artefato estático verificado
        id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
