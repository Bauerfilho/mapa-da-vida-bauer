<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF6F2" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Mentor Bauer · Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1a150e;
        background: #faf6f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        display: grid;
        place-items: center;
        background:
          linear-gradient(rgba(199, 151, 81, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(199, 151, 81, 0.08) 1px, transparent 1px),
          #faf6f2;
        background-size: 28px 28px;
      }

      main {
        width: min(100%, 420px);
        border-top: 1px solid rgba(199, 151, 81, 0.62);
        padding-top: 28px;
      }

      .mark {
        width: 56px;
        height: 56px;
        margin-bottom: 28px;
        border: 1px solid #c79751;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #6a121a;
        font-family: Georgia, serif;
        font-size: 30px;
        line-height: 1;
      }

      h1 {
        margin: 0 0 12px;
        color: #6a121a;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(34px, 10vw, 48px);
        font-weight: 500;
        line-height: 0.98;
      }

      p {
        margin: 0;
        color: #55504a;
        font-size: 16px;
        line-height: 1.55;
      }

      .privacy {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid rgba(199, 151, 81, 0.32);
        color: #746c65;
        font-size: 14px;
      }

      button {
        width: 100%;
        min-height: 52px;
        margin-top: 28px;
        border: 1px solid #6a121a;
        border-radius: 12px;
        color: #faf6f2;
        background: #6a121a;
        font: inherit;
        font-weight: 600;
      }

      button:focus-visible {
        outline: 3px solid rgba(199, 151, 81, 0.45);
        outline-offset: 3px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .connection {
        min-height: 22px;
        margin-top: 12px;
        color: #746c65;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <h1>Você está offline.</h1>
      <p>O conteúdo salvo continua disponível neste aparelho. Tente abrir o Mentor novamente quando a conexão voltar.</p>
      <p class="privacy">Seus registros permanecem no banco local privado e não fazem parte do cache descartável do aplicativo.</p>
      <p class="connection" id="connection" role="status" aria-live="polite"></p>
      <button id="retry" type="button">Tentar novamente</button>
    </main>
    <script>
      const retry = document.querySelector("#retry");
      const connection = document.querySelector("#connection");

      function renderConnection() {
        connection.textContent = navigator.onLine
          ? "Conexão recuperada. Você já pode tentar novamente."
          : "Sem conexão no momento.";
      }

      retry.addEventListener("click", () => {
        retry.disabled = true;
        connection.textContent = "Tentando abrir o Mentor…";
        location.reload();
      });
      window.addEventListener("online", renderConnection);
      window.addEventListener("offline", renderConnection);
      renderConnection();
    </script>
  </body>
</html>
